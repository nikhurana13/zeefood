version: "3.9"

# ================================================================
# ZEfood — Production Docker Compose Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ================================================================

services:
  backend:
    environment:
      - APP_ENV=production
      - DEBUG=false
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  user-app:
    build:
      args:
        VITE_API_BASE: ${BACKEND_URL:-https://api.zefood.com}
    restart: always

  staff-panel:
    build:
      args:
        VITE_API_BASE: ${BACKEND_URL:-https://api.zefood.com}
    restart: always

  admin-panel:
    build:
      args:
        VITE_API_BASE: ${BACKEND_URL:-https://api.zefood.com}
    restart: always
