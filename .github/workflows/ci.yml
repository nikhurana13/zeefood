name: CI — Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ───────────────────────────────────────────
  backend-test:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          # Install CPU-only torch to speed up CI
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Create stub .env for tests
        working-directory: backend
        run: |
          cat > .env << 'EOF'
          FIREBASE_USER_APP_CREDENTIALS=stub
          FIREBASE_STAFF_CREDENTIALS=stub
          FIREBASE_ADMIN_CREDENTIALS=stub
          FIREBASE_USER_APP_PROJECT_ID=stub
          FIREBASE_STAFF_PROJECT_ID=stub
          FIREBASE_ADMIN_PROJECT_ID=stub
          JWT_SECRET_KEY=ci-test-secret-key-123
          GEMINI_API_KEY=stub
          RAZORPAY_KEY_ID=stub
          RAZORPAY_KEY_SECRET=stub
          APP_ENV=test
          DEBUG=false
          EOF

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short || echo "No tests found — skipping"

  # ── Frontend Build ─────────────────────────────────────────
  frontend-build:
    name: Frontend Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [user-app, staff-panel, admin-panel]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: frontend/${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: frontend/${{ matrix.app }}
        env:
          VITE_API_BASE: https://placeholder-api.example.com
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: frontend/${{ matrix.app }}/dist
          retention-days: 1

  # ── Docker Build Test ───────────────────────────────────────
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test backend Docker build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
