name: Deploy Backend → Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy Backend to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Trigger Render Deploy Hook ──────────────────────────
      # Render auto-deploys on push to 'main' when connected to GitHub.
      # This step is optional — it manually triggers a deploy via webhook.
      # Add RENDER_DEPLOY_HOOK_URL as a GitHub secret for this to work.
      - name: Trigger Render Deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Render deploy triggered"

      # ── Also push Docker image to GHCR (optional registry backup) ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zefood-backend:latest
            ghcr.io/${{ github.repository_owner }}/zefood-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ================================================================
# Required GitHub Secrets (Settings → Secrets → Actions):
# ─────────────────────────────────────────────────────────────
# RENDER_DEPLOY_HOOK_URL  — From Render dashboard:
#                           Service → Settings → Deploy Hook → Copy URL
#
# Note: Render also auto-deploys when it detects a push to your
# connected GitHub branch. The deploy hook is just an extra trigger.
# ================================================================
