[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Suppress deprecation warnings from third-party libraries that are not
# under our control (python-jose, fastapi 0.111 on Python 3.14, starlette).
# Our own code warnings are NOT suppressed.
filterwarnings =
    default
    ignore::DeprecationWarning:jose.*
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:asyncio.*
